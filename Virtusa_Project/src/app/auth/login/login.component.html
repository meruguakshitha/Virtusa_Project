<div class="login-wrapper">
  <div class="login-card">
    <h2>Loan Approval System</h2>

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email" />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password" />

    <button (click)="login()">Login</button>
    <p class="error" *ngIf="error">{{ error }}</p>

  </div>

</div>
